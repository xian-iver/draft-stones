<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stones Fantasy Draft 2026-2027</title>
    <style>
        :root {
            --bg-dark: #0f172a;      /* Very dark navy */
            --bg-panel: #1e293b;     /* Slightly lighter navy for panels */
            --bg-input: #0f172a;     /* Input background */
            --border-color: #334155; /* Muted border */
            --text-main: #f8fafc;    /* White/gray text */
            --text-muted: #94a3b8;   /* Muted gray for headers */
            --accent: #0ea5e9;       /* Cyan/Blue accent */
            --accent-hover: #0284c7;
            --row-hover: #1e293b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Prevent full body scroll, handle inside panels */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container h1 {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        
        .logo-container h1 span {
            color: var(--accent);
        }

        .draft-info {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .info-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
        }

        .info-value.team-name {
            color: var(--accent);
        }
        
        .info-value.pick-number {
            color: #fbbf24; /* Yellow for pick */
        }

        .btn-undo {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-undo:hover {
            background-color: var(--border-color);
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }

        .sidebar {
            width: 350px;
            background-color: var(--bg-dark);
            display: flex;
            flex-direction: column;
        }

        .controls-bar {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            gap: 20px;
        }

        .search-container {
            flex: 1;
            max-width: 300px;
        }

        .search-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        
        .search-input:focus {
            border-color: var(--accent);
        }

        .filters {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        .filter-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .table-container {
            flex: 1;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
            color: var(--text-muted);
            font-size: 11px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            white-space: nowrap;
        }

        tr:hover td {
            background-color: var(--row-hover);
        }

        .col-player {
            font-weight: 600;
            color: var(--text-main);
        }

        .col-pos, .col-team {
            color: var(--text-muted);
        }

        .btn-action {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .btn-action:hover {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .sidebar-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }
        
        .empty-sidebar-state {
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo-container">
            <h1>THE STONES <span>FANTASY DRAFT 2026-2027</span></h1>
        </div>
        
        <div class="draft-info">
            <div class="info-block">
                <span class="info-label">On The Clock</span>
                <span class="info-value team-name">Team 1</span>
            </div>
            
            <div class="info-block">
                <span class="info-label">Round / Pick</span>
                <span class="info-value pick-number">1.01</span>
            </div>
            
            <button class="btn-undo">Undo</button>
        </div>
    </header>

    <div class="main-layout">
        <main class="content-area">
            <div class="controls-bar">
                <div class="search-container">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search players...">
                </div>
                
                <div class="filters" id="positionFilters">
                    <button class="filter-btn active" data-pos="ALL">ALL</button>
                    <button class="filter-btn" data-pos="PG">PG</button>
                    <button class="filter-btn" data-pos="SG">SG</button>
                    <button class="filter-btn" data-pos="SF">SF</button>
                    <button class="filter-btn" data-pos="PF">PF</button>
                    <button class="filter-btn" data-pos="C">C</button>
                </div>
                
                <label class="checkbox-container">
                    <input type="checkbox" id="hideDrafted"> Hide Drafted
                </label>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>RANK</th>
                            <th>PLAYER</th>
                            <th>POS</th>
                            <th>TEAM</th>
                            <th>PTS</th>
                            <th>REB</th>
                            <th>AST</th>
                            <th>STL</th>
                            <th>BLK</th>
                            <th>FG%</th>
                            <th>FT%</th>
                            <th>3PM</th>
                            <th>TO</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="playerTableBody">
                        <!-- Javascript will populate rows here -->
                    </tbody>
                </table>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Team 1</div>
                <div class="sidebar-subtitle">9-Cat Live Averages</div>
            </div>
            <div class="empty-sidebar-state">
                No players drafted yet.
            </div>
        </aside>
    </div>

    <script>
        // Array of 10 dummy players
        const dummyPlayers = [
            { id: 1, rank: 1, name: "Nikola Jokic", pos: "C", team: "DEN", pts: 26.4, reb: 12.4, ast: 9.0, stl: 1.4, blk: 0.9, fg: 63.2, ft: 82.2, tpm: 1.1, to: 3.0, drafted: false },
            { id: 2, rank: 2, name: "Luka Doncic", pos: "PG", team: "DAL", pts: 33.9, reb: 9.2, ast: 9.8, stl: 1.4, blk: 0.5, fg: 48.7, ft: 78.6, tpm: 4.1, to: 4.0, drafted: false },
            { id: 3, rank: 3, name: "Shai Gilgeous-Alexander", pos: "PG", team: "OKC", pts: 30.1, reb: 5.5, ast: 6.2, stl: 2.0, blk: 0.9, fg: 53.5, ft: 87.4, tpm: 1.3, to: 2.2, drafted: false },
            { id: 4, rank: 4, name: "Victor Wembanyama", pos: "C", team: "SAS", pts: 21.4, reb: 10.6, ast: 3.9, stl: 1.2, blk: 3.6, fg: 46.5, ft: 79.6, tpm: 1.8, to: 3.7, drafted: false },
            { id: 5, rank: 5, name: "Joel Embiid", pos: "C", team: "PHI", pts: 34.7, reb: 11.0, ast: 5.6, stl: 1.2, blk: 1.7, fg: 52.9, ft: 88.3, tpm: 1.4, to: 3.8, drafted: false },
            { id: 6, rank: 6, name: "Jayson Tatum", pos: "SF", team: "BOS", pts: 26.9, reb: 8.1, ast: 4.9, stl: 1.0, blk: 0.6, fg: 47.1, ft: 83.3, tpm: 3.1, to: 2.5, drafted: false },
            { id: 7, rank: 7, name: "Anthony Edwards", pos: "SG", team: "MIN", pts: 25.9, reb: 5.4, ast: 5.1, stl: 1.3, blk: 0.5, fg: 46.1, ft: 83.6, tpm: 2.4, to: 3.1, drafted: false },
            { id: 8, rank: 8, name: "Giannis Antetokounmpo", pos: "PF", team: "MIL", pts: 30.4, reb: 11.5, ast: 6.5, stl: 1.2, blk: 1.1, fg: 61.1, ft: 65.7, tpm: 0.5, to: 3.4, drafted: false },
            { id: 9, rank: 9, name: "Tyrese Haliburton", pos: "PG", team: "IND", pts: 20.1, reb: 3.9, ast: 10.9, stl: 1.2, blk: 0.7, fg: 47.7, ft: 85.5, tpm: 2.8, to: 2.3, drafted: false },
            { id: 10, rank: 10, name: "Kevin Durant", pos: "PF", team: "PHX", pts: 27.1, reb: 6.6, ast: 5.0, stl: 0.9, blk: 1.2, fg: 52.3, ft: 85.6, tpm: 2.2, to: 3.3, drafted: false }
        ];

        let currentSearch = "";
        let currentPos = "ALL";
        
        const tableBody = document.getElementById('playerTableBody');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderTable() {
            tableBody.innerHTML = '';

            const filteredPlayers = dummyPlayers.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase());
                const matchesPos = currentPos === "ALL" || p.pos === currentPos;
                return matchesSearch && matchesPos;
            });

            if (filteredPlayers.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="14" style="text-align: center; color: var(--text-muted); padding: 20px;">No players found matching your criteria.</td></tr>`;
                return;
            }

            filteredPlayers.forEach(player => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${player.rank}</td>
                    <td class="col-player">${player.name}</td>
                    <td class="col-pos">${player.pos}</td>
                    <td class="col-team">${player.team}</td>
                    <td>${player.pts.toFixed(1)}</td>
                    <td>${player.reb.toFixed(1)}</td>
                    <td>${player.ast.toFixed(1)}</td>
                    <td>${player.stl.toFixed(1)}</td>
                    <td>${player.blk.toFixed(1)}</td>
                    <td>${player.fg.toFixed(1)}</td>
                    <td>${player.ft.toFixed(1)}</td>
                    <td>${player.tpm.toFixed(1)}</td>
                    <td>${player.to.toFixed(1)}</td>
                    <td><button class="btn-action">DRAFT</button></td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Search listener
        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTable();
        });

        // Position Filter listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Update active class UI
                filterBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                // Update State and re-render
                currentPos = e.target.getAttribute('data-pos');
                renderTable();
            });
        });

        // Initial render on page load
        renderTable();
    </script>
</body>
</html>
