<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Fantasy Basketball Draft Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.260.0/lucide.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-cyan: #06b6d4;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Custom Scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Glassmorphism effects */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animations */
        @keyframes highlightDraft {
            0% { background-color: rgba(6, 182, 212, 0.3); }
            100% { background-color: transparent; }
        }
        .just-drafted {
            animation: highlightDraft 1.5s ease-out forwards;
        }

        /* Table styling */
        th {
            position: sticky;
            top: 0;
            background: #0f172a;
            z-index: 10;
        }
        
        .stat-col {
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .action-btn {
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: translateY(-1px);
        }
        .action-btn:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="h-16 border-b border-slate-700 glass-panel flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-3">
            <i data-lucide="trophy" class="text-amber-500 w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-tight text-white uppercase">Pro Draft <span class="text-cyan-400">Hub</span></h1>
        </div>
        
        <!-- Global Draft Status -->
        <div class="flex items-center gap-6">
            <div class="flex flex-col items-end">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">On The Clock</span>
                <span id="current-turn-display" class="text-lg font-bold text-cyan-400">Team 1</span>
            </div>
            <div class="h-8 w-px bg-slate-700"></div>
            <div class="flex flex-col items-end">
                <span class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Round / Pick</span>
                <span id="round-pick-display" class="text-lg font-bold text-amber-400">1.01</span>
            </div>
            <button onclick="undoLastPick()" class="ml-4 flex items-center gap-2 px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-sm font-medium border border-slate-600 transition-colors" title="Undo last pick">
                <i data-lucide="undo" class="w-4 h-4"></i> Undo
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- Left Panel: Player Pool -->
        <section class="flex-1 flex flex-col border-r border-slate-700 min-w-[60%] relative">
            
            <!-- Filters & Search -->
            <div class="p-4 glass-panel border-b border-slate-700 flex flex-wrap items-center gap-4 shrink-0 z-20">
                <div class="relative flex-1 min-w-[200px]">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Search players..." class="w-full bg-slate-900 border border-slate-700 rounded-md py-2 pl-9 pr-4 text-sm focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all text-white placeholder-slate-500">
                </div>
                <div class="flex gap-2">
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-cyan-600 text-white font-medium hover:bg-cyan-500 transition-colors" data-pos="ALL">ALL</button>
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors" data-pos="PG">PG</button>
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors" data-pos="SG">SG</button>
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors" data-pos="SF">SF</button>
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors" data-pos="PF">PF</button>
                    <button class="pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors" data-pos="C">C</button>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="hide-drafted" class="rounded bg-slate-900 border-slate-700 text-cyan-500 focus:ring-cyan-500 h-4 w-4" checked>
                    <label for="hide-drafted" class="text-sm text-slate-300 select-none cursor-pointer">Hide Drafted</label>
                </div>
            </div>

            <!-- Player Table -->
            <div class="flex-1 overflow-auto bg-slate-900 relative">
                <table class="w-full text-sm text-left border-collapse">
                    <thead class="text-xs text-slate-400 uppercase bg-[#0f172a] shadow-md border-b border-slate-700">
                        <tr>
                            <th class="px-4 py-3 font-semibold cursor-pointer hover:text-white transition-colors" onclick="sortTable('rank')">Rank</th>
                            <th class="px-4 py-3 font-semibold cursor-pointer hover:text-white transition-colors" onclick="sortTable('name')">Player</th>
                            <th class="px-2 py-3 font-semibold">Pos</th>
                            <th class="px-2 py-3 font-semibold">Team</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('pts')" title="Points">PTS</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('reb')" title="Rebounds">REB</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('ast')" title="Assists">AST</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('stl')" title="Steals">STL</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('blk')" title="Blocks">BLK</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('fgp')" title="Field Goal %">FG%</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('ftp')" title="Free Throw %">FT%</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('tpm')" title="3-Pointers Made">3PM</th>
                            <th class="px-2 py-3 font-semibold stat-col cursor-pointer hover:text-white transition-colors" onclick="sortTable('to')" title="Turnovers">TO</th>
                            <th class="px-4 py-3 font-semibold text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="player-table-body" class="divide-y divide-slate-800/50">
                        <!-- Rows rendered via JS -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Right Panel: Roster & Draft Board -->
        <section class="w-[40%] min-w-[400px] flex flex-col bg-slate-900 border-l border-slate-700">
            
            <!-- Teams Tabs -->
            <div class="flex overflow-x-auto bg-[#0f172a] border-b border-slate-700 p-2 gap-2 hide-scrollbar shrink-0" id="team-tabs">
                <!-- Tabs rendered via JS -->
            </div>

            <!-- Active Team Roster View -->
            <div class="flex-1 flex flex-col p-4 overflow-hidden gap-4">
                
                <div class="flex justify-between items-end pb-2 border-b border-slate-700 shrink-0">
                    <div>

                        <p class="text-xs text-slate-400">9-Cat Live Averages</p>

                    <div id="roster-averages" class="flex gap-3 text-xs bg-slate-800 px-3 py-2 rounded-lg border border-slate-700 shadow-inner">
                        <!-- Averages rendered via JS -->
                    </div>
                </div>

                <!-- Roster List -->
                <div class="flex-1 overflow-y-auto pr-2" id="roster-list">
                    <!-- Roster slots rendered via JS -->
                </div>
                
            </div>
        </section>
    </main>

            { id: 210, name: "Corey Kispert", team: "WAS", pos: "SF", pts: 13.4, reb: 2.8, ast: 2.0, stl: 0.5, blk: 0.2, fgp: 48.6, ftp: 82.6, tpm: 2.3, to: 1.0, bbrefId: "kispeco01" }
        ];

        // --- App State ---
        let currentSort = { col: 'rank', asc: true };
        let draftedPlayers = new Set(); 
        let draftHistory = []; 
        let currentTeamTurn = 1;
        const totalTeams = 12;
        const totalRounds = 13;
        
        // Initialize Rosters (12 teams, empty arrays)
        const rosters = {};
        for(let i=1; i<=totalTeams; i++) {
            rosters[i] = [];
        }

        let activeTabTeam = 1;

        // Initialize players with default rank based on dataset order
        playersData.forEach((p, idx) => p.rank = idx + 1);

        // --- Core Functions ---

        function getDraftInfo() {
            let totalPicks = draftHistory.length;
            let currentRound = Math.floor(totalPicks / totalTeams) + 1;
            let pickInRound = (totalPicks % totalTeams) + 1;
            
            // Snake Draft Logic
            let teamOnClock;
            if (currentRound % 2 !== 0) {
                teamOnClock = pickInRound; // Odd round: 1 to 12
            } else {
                teamOnClock = totalTeams - pickInRound + 1; // Even round: 12 to 1
            }

            if (currentRound > totalRounds) {
                return { round: 'DONE', pick: 'DONE', team: '-' };
            }
            return { round: currentRound, pick: pickInRound, team: teamOnClock, totalPick: totalPicks + 1 };
        }

        function updateDraftHeader() {
            const info = getDraftInfo();
            if (info.round === 'DONE') {
                document.getElementById('current-turn-display').textContent = 'DRAFT COMPLETE';
                document.getElementById('round-pick-display').textContent = '-';
            } else {
                document.getElementById('current-turn-display').textContent = `Team ${info.team}`;
                document.getElementById('round-pick-display').textContent = `${info.round}.${info.pick.toString().padStart(2, '0')} (${info.totalPick})`;
                currentTeamTurn = info.team;
                
                // Auto-switch tab to team on clock if we just made a pick
                switchTab(info.team);
            }
        }

        function draftPlayer(playerId) {
            const info = getDraftInfo();
            if (info.round === 'DONE') return;

            const player = playersData.find(p => p.id === playerId);
            if (!player || draftedPlayers.has(playerId)) return;

            // Update State
            draftedPlayers.add(playerId);
            rosters[info.team].push(player);
            draftHistory.push({ playerId, team: info.team });

            renderTable();
            updateDraftHeader();
            renderRoster(activeTabTeam);
        }

        function undoLastPick() {
            if (draftHistory.length === 0) return;
            const lastPick = draftHistory.pop();
            draftedPlayers.delete(lastPick.playerId);
            rosters[lastPick.team] = rosters[lastPick.team].filter(p => p.id !== lastPick.playerId);
            
            renderTable();
            updateDraftHeader();
            renderRoster(activeTabTeam);
        }

        // --- UI Rendering ---

        function getFilteredAndSortedPlayers() {
            const searchQ = document.getElementById('search-input').value.toLowerCase();
            const hideDrafted = document.getElementById('hide-drafted').checked;
            const activePosFilter = document.querySelector('.pos-filter.bg-cyan-600').dataset.pos;

            let filtered = playersData.filter(p => {
                if (hideDrafted && draftedPlayers.has(p.id)) return false;
                if (searchQ && !p.name.toLowerCase().includes(searchQ) && !p.team.toLowerCase().includes(searchQ)) return false;
                if (activePosFilter !== 'ALL' && p.pos !== activePosFilter) return false;
                return true;
            });

            filtered.sort((a, b) => {
                let valA = a[currentSort.col];
                let valB = b[currentSort.col];
                
                if (typeof valA === 'string') {
                    return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return currentSort.asc ? (valA - valB) : (valB - valA);
            });

            return filtered;
        }

        function renderTable() {
            const tbody = document.getElementById('player-table-body');
            const players = getFilteredAndSortedPlayers();
            
            tbody.innerHTML = '';
            
            players.forEach(p => {
                const isDrafted = draftedPlayers.has(p.id);
                const tr = document.createElement('tr');
                tr.className = `border-b border-slate-800 hover:bg-slate-800/50 transition-colors ${isDrafted ? 'opacity-30 pointer-events-none' : ''}`;
                
                // Construct BBRef Link
                const bbrefUrl = `https://www.basketball-reference.com/players/${p.bbrefId.charAt(0)}/${p.bbrefId}.html`;

                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium text-slate-300">${p.rank}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-white">${p.name}</span>
                            <a href="${bbrefUrl}" target="_blank" class="text-slate-500 hover:text-cyan-400" title="View on Basketball Reference">
                                <i data-lucide="external-link" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </td>
                    <td class="px-2 py-3"><span class="px-2 py-0.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">${p.pos}</span></td>
                    <td class="px-2 py-3 font-medium text-slate-400">${p.team}</td>
                    <td class="px-2 py-3 stat-col">${p.pts.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.reb.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.ast.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.stl.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.blk.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.fgp.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.ftp.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col">${p.tpm.toFixed(1)}</td>
                    <td class="px-2 py-3 stat-col text-slate-400">${p.to.toFixed(1)}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="draftPlayer(${p.id})" class="action-btn px-3 py-1 bg-cyan-600 hover:bg-cyan-500 text-white rounded font-medium text-xs shadow-lg shadow-cyan-900/20">
                            DRAFT
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function sortTable(col) {
            if (currentSort.col === col) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.col = col;
                // Default sorting direction logic
                if (['rank', 'name', 'team', 'pos', 'to'].includes(col)) {
                    currentSort.asc = true; // Lower is better or alphabetical
                } else {
                    currentSort.asc = false; // Higher is better for stats
                }
            }
            renderTable();
        }

        // --- Roster Logic ---
        function renderTabs() {
            const tabsContainer = document.getElementById('team-tabs');
            tabsContainer.innerHTML = '';
            for(let i=1; i<=totalTeams; i++) {
                const btn = document.createElement('button');
                const isActive = i === activeTabTeam;
                btn.className = `px-4 py-2 rounded-t-lg text-sm font-bold transition-colors whitespace-nowrap border-b-2 ${isActive ? 'bg-slate-800 text-cyan-400 border-cyan-400' : 'text-slate-400 border-transparent hover:text-slate-200 hover:bg-slate-800/50'}`;
                btn.innerText = `Team ${i}`;
                btn.onclick = () => switchTab(i);
                tabsContainer.appendChild(btn);
            }
        }

        function switchTab(teamNum) {
            activeTabTeam = teamNum;
            renderTabs();
            renderRoster(teamNum);
        }

        function renderRoster(teamNum) {
            document.getElementById('roster-title').textContent = `Team ${teamNum}`;
            const list = document.getElementById('roster-list');
            const avgContainer = document.getElementById('roster-averages');
            const teamRoster = rosters[teamNum];
            
            list.innerHTML = '';
            
            if (teamRoster.length === 0) {
                list.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 gap-3 opacity-50">
                        <i data-lucide="clipboard-list" class="w-12 h-12"></i>
                        <p>No players drafted yet.</p>
                    </div>`;
                avgContainer.innerHTML = `<span class="text-slate-500">No stats yet</span>`;
                lucide.createIcons();
                return;
            }

            // Calculate Averages
            const sums = teamRoster.reduce((acc, p) => {
                acc.pts += p.pts; acc.reb += p.reb; acc.ast += p.ast;
                acc.stl += p.stl; acc.blk += p.blk; acc.tpm += p.tpm; acc.to += p.to;
                acc.fgp += p.fgp; acc.ftp += p.ftp;
                return acc;
            }, {pts:0, reb:0, ast:0, stl:0, blk:0, tpm:0, to:0, fgp:0, ftp:0});
            
            const len = teamRoster.length;
            avgContainer.innerHTML = `
                <div class="flex flex-col items-center"><span class="text-slate-400">PTS</span><span class="font-bold text-white">${(sums.pts/len).toFixed(1)}</span></div>
                <div class="flex flex-col items-center"><span class="text-slate-400">REB</span><span class="font-bold text-white">${(sums.reb/len).toFixed(1)}</span></div>
                <div class="flex flex-col items-center"><span class="text-slate-400">AST</span><span class="font-bold text-white">${(sums.ast/len).toFixed(1)}</span></div>
                <div class="flex flex-col items-center"><span class="text-slate-400">FG%</span><span class="font-bold text-white">${(sums.fgp/len).toFixed(1)}</span></div>
            `;

            teamRoster.forEach((p, idx) => {
                // Check if this player was just drafted (last item in history)
                const isJustDrafted = draftHistory.length > 0 && draftHistory[draftHistory.length-1].playerId === p.id && teamNum === activeTabTeam;
                
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 rounded-lg border border-slate-700 mb-2 ${isJustDrafted ? 'just-drafted' : 'bg-slate-800/50'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="text-xs font-bold text-slate-500 w-4">${idx + 1}.</div>
                        <div>
                            <div class="font-bold text-slate-100 flex items-center gap-2">
                                ${p.name} 
                                <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-300 font-semibold uppercase tracking-wider">${p.pos} - ${p.team}</span>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
            
            lucide.createIcons();
            // Scroll to bottom
            list.scrollTop = list.scrollHeight;
        }

        // --- Event Listeners ---
        document.getElementById('search-input').addEventListener('input', renderTable);
        document.getElementById('hide-drafted').addEventListener('change', renderTable);
        
        document.querySelectorAll('.pos-filter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.pos-filter').forEach(b => {
                    b.className = "pos-filter px-3 py-1.5 text-sm rounded-md bg-slate-800 text-slate-300 font-medium hover:bg-slate-700 border border-slate-700 transition-colors";
                });
                e.target.className = "pos-filter px-3 py-1.5 text-sm rounded-md bg-cyan-600 text-white font-medium hover:bg-cyan-500 transition-colors";
                renderTable();
            });
        });

        // Initialize
        updateDraftHeader();
        renderTabs();
        renderRoster(1);
        renderTable();

    </script>
</body>
</html>
