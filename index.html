<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Fantasy Draft Board 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
        
        .neon-text { text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); }
        .neon-border { box-shadow: 0 0 15px rgba(6, 182, 212, 0.3); border-color: #06b6d4; }
        .neon-amber { box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); border-color: #f59e0b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex justify-between items-center shadow-lg z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-cyan-500 flex items-center justify-center text-slate-900 font-black text-xl shadow-[0_0_15px_rgba(6,182,212,0.6)]">F</div>
            <h1 class="text-xl font-extrabold tracking-wider text-white neon-text">FANTASY <span class="text-cyan-400">DRAFT</span></h1>
        </div>
        <div id="on-the-clock-banner" class="bg-slate-800 border border-amber-500 px-6 py-1.5 rounded-full flex items-center gap-3 neon-amber animate-pulse">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">On The Clock</span>
            <span id="current-manager-display" class="font-bold text-amber-400">Manager 1 (Pick #1)</span>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 min-h-0">
        
        <!-- Left Sidebar: Draft Pool -->
        <section class="lg:col-span-3 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 bg-slate-850">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3">Draft Pool</h2>
                <input type="text" id="search-input" placeholder="Search players..." class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
            <div id="player-pool" class="flex-1 overflow-y-auto p-2 space-y-2">
                <!-- Player cards injected via JS -->
            </div>
        </section>

        <!-- Center: Draft Board -->
        <section class="lg:col-span-6 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 bg-slate-850 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest">Live Draft Board</h2>
                <span class="text-xs text-slate-500">Snake Draft Format</span>
            </div>
            <div class="flex-1 overflow-auto p-4 bg-slate-950/50">
                <div id="draft-board" class="grid gap-1 min-w-[600px]">
                    <!-- Draft board grid injected via JS -->
                </div>
            </div>
        </section>

        <!-- Right Sidebar: Manager Rosters & Stats -->
        <section class="lg:col-span-3 bg-slate-900 rounded-xl border border-slate-800 flex flex-col overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 bg-slate-850 shrink-0">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3">Manager Rosters</h2>
                <select id="manager-select" class="w-full bg-slate-950 border border-slate-700 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-cyan-500 transition-colors cursor-pointer">
                    <!-- Options injected via JS -->
                </select>
            </div>
            <div class="flex-1 overflow-y-auto bg-slate-950/30">
                <table class="w-full text-left text-[11px] whitespace-nowrap">
                    <thead class="bg-slate-800 text-slate-400 sticky top-0 shadow-sm z-10">
                        <tr>
                            <th class="py-2 px-3 font-semibold">Player</th>
                            <th class="py-2 px-1 font-semibold text-center">PTS</th>
                            <th class="py-2 px-1 font-semibold text-center">REB</th>
                            <th class="py-2 px-1 font-semibold text-center">AST</th>
                            <th class="py-2 px-1 font-semibold text-center">STL</th>
                            <th class="py-2 px-1 font-semibold text-center">BLK</th>
                            <th class="py-2 px-1 font-semibold text-center">FG%</th>
                            <th class="py-2 px-1 font-semibold text-center">3P%</th>
                            <th class="py-2 px-1 font-semibold text-center">FT%</th>
                            <th class="py-2 px-1 font-semibold text-center">TO</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table-body" class="divide-y divide-slate-800/50">
                        <!-- Roster rows injected via JS -->
                    </tbody>
                    <tfoot id="roster-table-foot" class="bg-slate-850 text-cyan-400 sticky bottom-0 border-t border-slate-700 shadow-[0_-5px_10px_rgba(0,0,0,0.2)]">
                        <!-- Averages injected via JS -->
                    </tfoot>
                </table>
            </div>
        </section>

    </main>

    <script>
        // --- 1. MOCK DATA SETUP ---
        const totalManagers = 10;
        const totalRounds = 10; 
        let currentPick = 1;
        let draftedPlayers = [];

        const managers = Array.from({ length: totalManagers }, (_, i) => ({
            id: i + 1,
            name: `Manager ${i + 1}`
        }));

        // Basketball Reference IDs added (e.g. jokicni01 -> https://www.basketball-reference.com/players/j/jokicni01.html)
        const playersDatabase = [
            { id: 1, name: "Nikola Jokic", bbrefId: "jokicni01", team: "DEN", pos: "C", ppg: 26.4, rpg: 12.4, apg: 9.0, spg: 1.4, bpg: 0.9, fgp: 58.3, tpp: 35.9, ftp: 81.7, to: 3.0 },
            { id: 2, name: "Luka Doncic", bbrefId: "doncilu01", team: "DAL", pos: "PG", ppg: 33.9, rpg: 9.2, apg: 9.8, spg: 1.4, bpg: 0.5, fgp: 48.7, tpp: 38.2, ftp: 78.6, to: 4.0 },
            { id: 3, name: "Shai Gilgeous-Alexander", bbrefId: "gilgesh01", team: "OKC", pos: "PG", ppg: 30.1, rpg: 5.5, apg: 6.2, spg: 2.0, bpg: 0.9, fgp: 53.5, tpp: 35.3, ftp: 87.4, to: 2.2 },
            { id: 4, name: "Joel Embiid", bbrefId: "embiijo01", team: "PHI", pos: "C", ppg: 34.7, rpg: 11.0, apg: 5.6, spg: 1.2, bpg: 1.7, fgp: 52.9, tpp: 38.8, ftp: 88.3, to: 3.8 },
            { id: 5, name: "Giannis Antetokounmpo", bbrefId: "antetgi01", team: "MIL", pos: "PF", ppg: 30.4, rpg: 11.5, apg: 6.5, spg: 1.2, bpg: 1.1, fgp: 61.1, tpp: 27.4, ftp: 65.7, to: 3.4 },
            { id: 6, name: "Jayson Tatum", bbrefId: "tatumja01", team: "BOS", pos: "SF", ppg: 26.9, rpg: 8.1, apg: 4.9, spg: 1.0, bpg: 0.6, fgp: 47.1, tpp: 37.6, ftp: 83.3, to: 2.5 },
            { id: 7, name: "Tyrese Haliburton", bbrefId: "halibty01", team: "IND", pos: "PG", ppg: 20.1, rpg: 3.9, apg: 10.9, spg: 1.2, bpg: 0.7, fgp: 47.7, tpp: 36.4, ftp: 85.5, to: 2.3 },
            { id: 8, name: "Stephen Curry", bbrefId: "curryst01", team: "GSW", pos: "PG", ppg: 26.4, rpg: 4.5, apg: 5.1, spg: 0.7, bpg: 0.4, fgp: 45.0, tpp: 40.8, ftp: 92.3, to: 2.8 },
            { id: 9, name: "Anthony Davis", bbrefId: "davisan01", team: "LAL", pos: "C", ppg: 24.7, rpg: 12.6, apg: 3.5, spg: 1.2, bpg: 2.3, fgp: 55.6, tpp: 27.1, ftp: 81.6, to: 2.1 },
            { id: 10, name: "Kevin Durant", bbrefId: "duranke01", team: "PHX", pos: "PF", ppg: 27.1, rpg: 6.6, apg: 5.0, spg: 0.9, bpg: 1.2, fgp: 52.3, tpp: 41.3, ftp: 85.6, to: 3.3 },
            { id: 11, name: "Victor Wembanyama", bbrefId: "wembavi01", team: "SAS", pos: "C", ppg: 21.4, rpg: 10.6, apg: 3.9, spg: 1.2, bpg: 3.6, fgp: 46.5, tpp: 32.5, ftp: 79.6, to: 3.7 },
            { id: 12, name: "Devin Booker", bbrefId: "bookede01", team: "PHX", pos: "SG", ppg: 27.1, rpg: 4.5, apg: 6.9, spg: 0.9, bpg: 0.4, fgp: 49.2, tpp: 35.6, ftp: 88.6, to: 2.6 },
            { id: 13, name: "Anthony Edwards", bbrefId: "edwaran01", team: "MIN", pos: "SG", ppg: 25.9, rpg: 5.4, apg: 5.1, spg: 1.3, bpg: 0.5, fgp: 46.1, tpp: 35.7, ftp: 83.6, to: 3.1 },
            { id: 14, name: "Jalen Brunson", bbrefId: "brunsja01", team: "NYK", pos: "PG", ppg: 28.7, rpg: 3.6, apg: 6.7, spg: 0.9, bpg: 0.2, fgp: 47.9, tpp: 40.1, ftp: 84.7, to: 2.4 },
            { id: 15, name: "Donovan Mitchell", bbrefId: "mitchdo01", team: "CLE", pos: "SG", ppg: 26.6, rpg: 5.1, apg: 6.1, spg: 1.8, bpg: 0.5, fgp: 46.2, tpp: 36.8, ftp: 86.5, to: 2.8 },
            { id: 16, name: "Domantas Sabonis", bbrefId: "sabondo01", team: "SAC", pos: "C", ppg: 19.4, rpg: 13.7, apg: 8.2, spg: 0.9, bpg: 0.6, fgp: 59.4, tpp: 37.9, ftp: 70.4, to: 3.3 },
            { id: 17, name: "De'Aaron Fox", bbrefId: "foxde01", team: "SAC", pos: "PG", ppg: 26.6, rpg: 4.6, apg: 5.6, spg: 2.0, bpg: 0.4, fgp: 46.5, tpp: 36.9, ftp: 73.8, to: 2.6 },
            { id: 18, name: "LeBron James", bbrefId: "jamesle01", team: "LAL", pos: "SF", ppg: 25.7, rpg: 7.3, apg: 8.3, spg: 1.3, bpg: 0.5, fgp: 54.0, tpp: 41.0, ftp: 75.0, to: 3.0 },
            { id: 19, name: "Damian Lillard", bbrefId: "lillada01", team: "MIL", pos: "PG", ppg: 24.3, rpg: 4.4, apg: 7.0, spg: 1.0, bpg: 0.2, fgp: 42.4, tpp: 35.4, ftp: 92.0, to: 2.5 },
            { id: 20, name: "Trae Young", bbrefId: "youngtr01", team: "ATL", pos: "PG", ppg: 25.7, rpg: 2.8, apg: 10.8, spg: 1.3, bpg: 0.2, fgp: 43.0, tpp: 37.3, ftp: 85.5, to: 4.4 }
        ];

        let availablePlayers = [...playersDatabase];

        // --- 2. CORE LOGIC ---
        function getManagerIdForPick(pick) {
            const round = Math.ceil(pick / totalManagers);
            const pickInRound = (pick - 1) % totalManagers + 1;
            return round % 2 !== 0 ? pickInRound : totalManagers - pickInRound + 1;
        }

        function draftPlayer(playerId) {
            if (currentPick > totalManagers * totalRounds) return alert("Draft is complete!");
            
            const playerIndex = availablePlayers.findIndex(p => p.id === playerId);
            if (playerIndex === -1) return;

            const player = availablePlayers.splice(playerIndex, 1)[0];
            const managerId = getManagerIdForPick(currentPick);

            draftedPlayers.push({ pick: currentPick, managerId, player });
            currentPick++;
            updateUI();
        }

        // --- 3. RENDER FUNCTIONS ---
        function getBBRefURL(bbrefId) {
            return `https://www.basketball-reference.com/players/${bbrefId.charAt(0)}/${bbrefId}.html`;
        }

        function renderPlayerPool(searchTerm = "") {
            const poolContainer = document.getElementById('player-pool');
            poolContainer.innerHTML = '';

            const filtered = availablePlayers.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase()));

            filtered.forEach(player => {
                const url = getBBRefURL(player.bbrefId);
                const card = document.createElement('div');
                card.className = 'p-3 bg-slate-800 rounded-lg flex justify-between items-center border border-slate-700 hover:border-cyan-500 transition-colors shadow-sm group';
                
                card.innerHTML = `
                    <div class="overflow-hidden pr-2">
                        <div class="font-bold text-slate-100 truncate flex items-center gap-2">
                            ${player.name}
                            <a href="${url}" target="_blank" title="View on Basketball Reference" class="text-[9px] bg-slate-700 hover:bg-cyan-500 hover:text-slate-900 px-1.5 py-0.5 rounded text-slate-300 font-bold transition-colors">BR</a>
                        </div>
                        <div class="text-xs text-slate-400 mt-0.5"><span class="text-cyan-400 font-semibold">${player.pos}</span> • ${player.team}</div>
                        <div class="text-[10px] text-slate-500 mt-1 flex gap-2">
                            <span>${player.ppg} PTS</span>
                            <span>${player.rpg} REB</span>
                            <span>${player.apg} AST</span>
                        </div>
                    </div>
                    <button onclick="draftPlayer(${player.id})" class="bg-cyan-600 hover:bg-cyan-500 text-slate-900 text-xs font-bold px-3 py-1.5 rounded uppercase tracking-wide opacity-0 group-hover:opacity-100 transition-opacity focus:opacity-100 shrink-0 shadow-lg">
                        Draft
                    </button>
                `;
                poolContainer.appendChild(card);
            });
        }

        function renderDraftBoard() {
            const board = document.getElementById('draft-board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(${totalManagers}, minmax(0, 1fr))`;

            for (let i = 1; i <= totalManagers; i++) {
                const header = document.createElement('div');
                header.className = 'text-center text-[11px] font-bold text-slate-400 py-2 border-b border-slate-700 bg-slate-800 sticky top-0 z-10 truncate px-1';
                header.style.gridColumn = i;
                header.style.gridRow = 1;
                header.innerText = `M${i}`;
                board.appendChild(header);
            }

            const maxPicks = totalManagers * totalRounds;
            for (let p = 1; p <= maxPicks; p++) {
                const managerId = getManagerIdForPick(p);
                const round = Math.ceil(p / totalManagers);
                
                const cell = document.createElement('div');
                cell.style.gridColumn = managerId;
                cell.style.gridRow = round + 1;
                
                let baseClasses = 'border border-slate-800 p-1 flex flex-col justify-center items-center text-center h-16 relative transition-all ';

                if (p === currentPick) {
                    cell.className = baseClasses + 'bg-amber-500/20 neon-amber z-0 scale-[1.02] rounded';
                } else if (p < currentPick) {
                    cell.className = baseClasses + 'bg-slate-800/80';
                } else {
                    cell.className = baseClasses + 'bg-slate-900/30';
                }

                const pickNum = document.createElement('span');
                pickNum.className = `text-[9px] absolute top-0.5 left-1 ${p === currentPick ? 'text-amber-400 font-bold' : 'text-slate-500'}`;
                pickNum.innerText = `${round}.${(p-1)%totalManagers + 1}`;
                cell.appendChild(pickNum);

                const drafted = draftedPlayers.find(d => d.pick === p);
                if (drafted) {
                    const nameParts = drafted.player.name.split(' ');
                    const lastName = nameParts.length > 1 ? nameParts.slice(1).join(' ') : nameParts[0];
                    cell.innerHTML += `
                        <span class="text-xs font-semibold text-slate-100 mt-2 truncate w-full px-0.5">${lastName}</span>
                        <span class="text-[9px] text-cyan-400">${drafted.player.pos}</span>
                    `;
                }
                board.appendChild(cell);
            }
        }

        function renderManagerOptions() {
            const select = document.getElementById('manager-select');
            select.innerHTML = '';
            managers.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m.id;
                opt.innerText = m.name;
                if(m.id === getManagerIdForPick(currentPick)) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function renderRoster() {
            const managerId = parseInt(document.getElementById('manager-select').value) || getManagerIdForPick(currentPick);
            const tbody = document.getElementById('roster-table-body');
            const tfoot = document.getElementById('roster-table-foot');
            
            tbody.innerHTML = '';
            tfoot.innerHTML = '';

            const roster = draftedPlayers.filter(d => d.managerId === managerId).map(d => d.player);
            
            if (roster.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-4 text-slate-500 italic">No players drafted yet.</td></tr>`;
                return;
            }

            let sums = { ppg:0, rpg:0, apg:0, spg:0, bpg:0, fgp:0, tpp:0, ftp:0, to:0 };

            roster.forEach(p => {
                sums.ppg += p.ppg; sums.rpg += p.rpg; sums.apg += p.apg; 
                sums.spg += p.spg; sums.bpg += p.bpg; sums.fgp += p.fgp; 
                sums.tpp += p.tpp; sums.ftp += p.ftp; sums.to += p.to;

                const url = getBBRefURL(p.bbrefId);

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/50 transition-colors text-slate-300">
                        <td class="py-2 px-3 flex items-center gap-2">
                            <span class="font-semibold text-slate-100">${p.name}</span>
                            <a href="${url}" target="_blank" title="Basketball Reference" class="text-[8px] bg-slate-700 hover:bg-cyan-500 hover:text-slate-900 px-1 py-0.5 rounded text-slate-400 font-bold transition-colors">BR</a>
                            <span class="text-[9px] text-cyan-400 ml-auto">${p.pos}</span>
                        </td>
                        <td class="py-2 px-1 text-center">${p.ppg.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.rpg.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.apg.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.spg.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.bpg.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.fgp.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.tpp.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.ftp.toFixed(1)}</td>
                        <td class="py-2 px-1 text-center">${p.to.toFixed(1)}</td>
                    </tr>
                `;
            });

            const c = roster.length;
            tfoot.innerHTML = `
                <tr class="font-bold text-cyan-400 bg-slate-850">
                    <td class="py-2 px-3">PROJ. AVERAGES</td>
                    <td class="py-2 px-1 text-center">${(sums.ppg / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.rpg / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.apg / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.spg / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.bpg / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.fgp / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.tpp / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.ftp / c).toFixed(1)}</td>
                    <td class="py-2 px-1 text-center">${(sums.to / c).toFixed(1)}</td>
                </tr>
            `;
        }

        function updateHeader() {
            const banner = document.getElementById('current-manager-display');
            if (currentPick > totalManagers * totalRounds) {
                banner.innerText = "DRAFT COMPLETE";
                document.getElementById('on-the-clock-banner').classList.remove('animate-pulse');
                document.getElementById('on-the-clock-banner').classList.replace('neon-amber', 'neon-border');
            } else {
                const mId = getManagerIdForPick(currentPick);
                banner.innerText = `Manager ${mId} (Pick #${currentPick})`;
            }
        }

        function updateUI() {
            updateHeader();
            renderPlayerPool(document.getElementById('search-input').value);
            renderDraftBoard();
            
            const select = document.getElementById('manager-select');
            select.value = getManagerIdForPick(currentPick); 
            renderRoster();
        }

        // --- 4. INITIALIZATION ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            renderPlayerPool(e.target.value);
        });

        document.getElementById('manager-select').addEventListener('change', () => {
            renderRoster();
        });

        function init() {
            renderManagerOptions();
            updateUI();
        }

        // Start App
        init();
    </script>
</body>
</html>
