<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Stones Fantasy Draft Board</title>
<style>
:root{--bg:#12151b;--panel:#1b2029;--line:#2b3340;--text:#e8ecf2;--mut:#8b95a5;--acc:#ff9f1c;--good:#4cc9a0;--bad:#ef6461}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Bahnschrift,"Segoe UI",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:20px;letter-spacing:.3px}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--text);background:#232a36;border:1px solid var(--line);border-radius:6px;padding:7px 12px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
nav button.on{background:var(--acc);color:#1a1200;border-color:var(--acc);font-weight:700}
.reset{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:700}
main{padding:20px;max-width:1400px;margin:0 auto}
.clock{display:flex;flex-wrap:wrap;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:8px;padding:16px 20px;margin-bottom:16px}
.clock .big{font-size:30px;font-weight:700;color:var(--acc)}
.mut{color:var(--mut)}
.next{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:#232a36;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input{min-width:240px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;background:var(--panel)}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr:hover td{background:#212836}
.pos{color:var(--mut);font-size:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.punt{border:2px solid var(--acc);background:#2a2113;border-radius:8px;padding:14px 18px;margin:16px 0;font-size:16px}
.punt b{color:var(--acc)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.cat{background:#232a36;border-radius:6px;padding:8px 10px;border-bottom:3px solid var(--line)}
.cat .v{font-size:20px;font-weight:700}.cat.lo{border-color:var(--bad)}.cat.hi{border-color:var(--good)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.row input{flex:1;max-width:320px}.row .n{width:90px;color:var(--mut)}
.grid th,.grid td{text-align:left;white-space:normal;min-width:118px;vertical-align:top;font-size:12px}
.grid td.cur{outline:2px solid var(--acc);outline-offset:-2px}
.grid td .pk{color:var(--mut);font-size:11px}
.grid td.filled{background:#1f2a33}
.grid .snake{color:var(--mut);font-size:11px;font-weight:400}
@media (prefers-reduced-motion:no-preference){.clock .big{transition:color .2s}}
</style>
</head>

  const [name,team,pos,st]=l.split('|'), s=st.split(',').map(Number);
  return {id:i,name,team,pos,pts:s[0],reb:s[1],ast:s[2],stl:s[3],blk:s[4],tpm:s[5],fg:s[6]/1000,ft:s[7]/1000,to:s[8]};
});
const CATS=[['pts','PTS',1],['reb','REB',1],['ast','AST',1],['stl','STL',1],['blk','BLK',1],['tpm','3PM',1],['fg','FG%',1],['ft','FT%',1],['to','TO',-1]];
const fmt=(k,v)=>(k==='fg'||k==='ft')?v.toFixed(3).replace(/^0/,''):v.toFixed(1);
// League baseline: mean and spread of every player in the pool, per category
const BASE={};CATS.forEach(([k])=>{const a=PLAYERS.map(p=>p[k]),m=a.reduce((x,y)=>x+y,0)/a.length;BASE[k]={m,sd:Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/a.length)||1}});

const N=9,ROUNDS=13,TOTAL=N*ROUNDS,KEY='nbaFantasyDraft9x13.v1';
const fresh=()=>({names:Array.from({length:N},(_,i)=>'Manager '+(i+1)),order:[...Array(N).keys()],started:false,picks:[]});
let S=load(),tab=S.started?'draft':'setup',rosterMgr=0,q='',posF='';

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.names)&&d.names.length===N&&Array.isArray(d.order)&&d.order.length===N&&Array.isArray(d.picks))return d;
  }catch(e){}
  return fresh();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mgrAt=n=>{const r=Math.floor(n/N),p=n%N;return S.order[r%2?N-1-p:p]};
const drafted=()=>new Set(S.picks.map(p=>p.pid));
const roster=m=>S.picks.filter(p=>p.mgr===m).map(p=>PLAYERS[p.pid]);

function draft(pid){
  if(!S.started||S.picks.length>=TOTAL||drafted().has(pid))return;
  S.picks.push({pid,mgr:mgrAt(S.picks.length)});
  save();render();
}
function undo(){if(S.picks.length){S.picks.pop();save();render()}}

document.getElementById('reset').onclick=()=>{
  if(confirm('Reset the draft? This clears all picks, manager names and saved data.')){
    localStorage.removeItem(KEY);S=fresh();tab='setup';rosterMgr=0;q='';posF='';render();
  }
};

function render(){
  const nav=document.getElementById('nav');
  nav.innerHTML=[['draft','Draft Room'],['rosters','Team Rosters'],['board','Draft Board'],['setup','Setup']]
    .map(([k,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  const app=document.getElementById('app');
  ({draft:viewDraft,rosters:viewRosters,board:viewBoard,setup:viewSetup})[tab](app);
}

function clockHTML(){
  const n=S.picks.length;
  if(!S.started)return `<div class="clock"><div><div class="big">Draft not started</div><div class="mut">Name your managers and set the order in Setup.</div></div></div>`;
  if(n>=TOTAL)return `<div class="clock"><div class="big">Draft complete</div><div class="mut">All ${TOTAL} picks are in. Check Team Rosters for punting analysis.</div></div>`;
  const nx=[];for(let i=n+1;i<Math.min(n+6,TOTAL);i++)nx.push(`<span class="chip">#${i+1} ${esc(S.names[mgrAt(i)])}</span>`);
  return `<div class="clock"><div><div class="mut">On the clock · Round ${Math.floor(n/N)+1} of ${ROUNDS} · Pick ${n+1} of ${TOTAL}</div>
  <div class="big">${esc(S.names[mgrAt(n)])}</div></div>
  <div><div class="mut">Picking next</div><div class="next">${nx.join('')||'<span class="mut">Final pick</span>'}</div></div>
  <button id="undo" ${n?'':'disabled'}>Undo last pick</button></div>`;
}

function viewDraft(app){
  app.innerHTML=clockHTML()+`<div class="tools"><input id="q" type="search" placeholder="Search players or teams" value="${esc(q)}">
  <select id="pos"><option value="">All positions</option>${['G','F','C'].map(p=>`<option ${posF===p?'selected':''}>${p}</option>`).join('')}</select>
  <span class="mut" id="cnt"></span></div><div class="wrap" style="max-height:62vh;overflow:auto"><table><thead><tr><th>Player</th><th class="l">Team</th><th class="l">Pos</th>${CATS.map(c=>`<th>${c[1]}</th>`).join('')}<th></th></tr></thead><tbody id="pool"></tbody></table></div>`;
  const u=document.getElementById('undo');if(u)u.onclick=undo;
  document.getElementById('q').oninput=e=>{q=e.target.value;pool()};
  document.getElementById('pos').onchange=e=>{posF=e.target.value;pool()};
  pool();
}
function pool(){
  const d=drafted(),t=q.trim().toLowerCase(),can=S.started&&S.picks.length<TOTAL;
  const list=PLAYERS.filter(p=>!d.has(p.id)&&(!posF||p.pos.includes(posF))&&(!t||(p.name+' '+p.team).toLowerCase().includes(t)));
  document.getElementById('cnt').textContent=list.length+' available';
  const tb=document.getElementById('pool');
  tb.innerHTML=list.length?list.map(p=>`<tr><td>${esc(p.name)}</td><td class="l pos">${p.team}</td><td class="l pos">${p.pos}</td>${CATS.map(c=>`<td>${fmt(c[0],p[c[0]])}</td>`).join('')}<td><button data-id="${p.id}" ${can?'':'disabled'}>Draft</button></td></tr>`).join('')
    :`<tr><td colspan="13" class="mut">No players match. Clear the search or position filter.</td></tr>`;
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>draft(+b.dataset.id));
}

function viewRosters(app){
  const r=roster(rosterMgr);
  let h=`<div class="tools"><select id="rm">${S.order.map(m=>`<option value="${m}" ${m===rosterMgr?'selected':''}>${esc(S.names[m])}</option>`).join('')}</select>
  <span class="mut">${r.length} of ${ROUNDS} players</span></div>`;
  if(!r.length){h+=`<div class="panel mut">No players yet. Draft players for ${esc(S.names[rosterMgr])} and the punting analysis will appear here.</div>`}
  else{
    const avg={},z={};
    CATS.forEach(([k,,dir])=>{avg[k]=r.reduce((a,p)=>a+p[k],0)/r.length;z[k]=(avg[k]-BASE[k].m)/BASE[k].sd*dir});
    const rank=CATS.map(c=>c[0]).sort((a,b)=>z[a]-z[b]);
    const nm=k=>CATS.find(c=>c[0]===k)[1];
    const low=rank.slice(0,2),hi=rank.slice(-2);
    h+=`<div class="punt"><b>Recommended Punting Strategy</b><br>Based on your current roster, your best strategy is to punt ${nm(low[0])} and ${nm(low[1])}.
    <div class="mut" style="font-size:13px;margin-top:4px">Lowest relative categories versus the pool average. Strongest so far: ${nm(hi[1])} and ${nm(hi[0])}.${r.length<4?' Early read: it firms up as you draft more players.':''}</div></div>
    <div class="cats">${CATS.map(([k,l])=>`<div class="cat ${low.includes(k)?'lo':hi.includes(k)?'hi':''}"><div class="mut">${l}</div><div class="v">${fmt(k,avg[k])}</div><div class="mut" style="font-size:11px">${z[k]>=0?'+':''}${z[k].toFixed(2)} vs pool</div></div>`).join('')}</div>`;
    h+=`<div class="wrap"><table><thead><tr><th>Player</th><th class="l">Team</th><th class="l">Pos</th>${CATS.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${r.map(p=>`<tr><td>${esc(p.name)}</td><td class="l pos">${p.team}</td><td class="l pos">${p.pos}</td>${CATS.map(c=>`<td>${fmt(c[0],p[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="mut">Team averages are simple per-player means (FG% and FT% unweighted). The pool baseline is the average of all ${PLAYERS.length} players; TO counts lower as better.</p>`;
  }
  app.innerHTML=h;
  document.getElementById('rm').onchange=e=>{rosterMgr=+e.target.value;render()};
}

function viewBoard(app){
  const cell={};S.picks.forEach((p,i)=>{cell[Math.floor(i/N)+'-'+p.mgr]={n:i+1,p:PLAYERS[p.pid]}});
  const cur=S.picks.length,cr=Math.floor(cur/N),cm=cur<TOTAL?mgrAt(cur):-1;
  let h=clockHTML()+`<div class="wrap"><table class="grid"><thead><tr><th>Round</th>${S.order.map(m=>`<th>${esc(S.names[m])}</th>`).join('')}</tr></thead><tbody>`;
  for(let r=0;r<ROUNDS;r++){
    h+=`<tr><th>${r+1}<div class="snake">${r%2?'right to left':'left to right'}</div></th>`;
    S.order.forEach(m=>{
      const c=cell[r+'-'+m],isCur=S.started&&r===cr&&m===cm;
      h+=`<td class="${c?'filled':''} ${isCur?'cur':''}">${c?`<div class="pk">Pick ${c.n}</div>${esc(c.p.name)} <span class="pos">${c.p.team} ${c.p.pos}</span>`:isCur?'<span style="color:var(--acc)">On the clock</span>':''}</td>`;
    });
    h+='</tr>';
  }
  app.innerHTML=h+'</tbody></table></div>';
  const u=document.getElementById('undo');if(u)u.onclick=undo;
}

function viewSetup(app){
  const locked=S.picks.length>0;
  app.innerHTML=`<div class="panel"><h2 style="margin-top:0">Managers and draft order</h2>
  <p class="mut">${locked?'Order is locked once picks are made. You can still rename managers.':'Type each manager name and use the arrows to set the order. Round 1 runs top to bottom, round 2 reverses, and so on.'}</p>
  ${S.order.map((m,i)=>`<div class="row"><span class="n">Slot ${i+1}</span><input data-m="${m}" value="${esc(S.names[m])}" maxlength="24" aria-label="Manager name for slot ${i+1}">
  <button data-up="${i}" ${locked||i===0?'disabled':''} aria-label="Move up">&uarr;</button><button data-dn="${i}" ${locked||i===N-1?'disabled':''} aria-label="Move down">&darr;</button></div>`).join('')}
  <div style="margin-top:14px;display:flex;gap:8px;align-items:center"><button id="go" class="on" style="background:var(--acc);color:#1a1200;font-weight:700;border-color:var(--acc)">${S.started?'Back to draft room':'Start draft'}</button>
  <span class="mut">${N} managers, ${ROUNDS} rounds, ${TOTAL} picks, ${PLAYERS.length} players in the pool.</span></div></div>`;
  app.querySelectorAll('input[data-m]').forEach(i=>i.oninput=()=>{S.names[+i.dataset.m]=i.value.trim()||('Manager '+(+i.dataset.m+1));save()});
  const mv=(i,j)=>{[S.order[i],S.order[j]]=[S.order[j],S.order[i]];save();render()};
  app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>mv(+b.dataset.up,+b.dataset.up-1));
  app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>mv(+b.dataset.dn,+b.dataset.dn+1));
  document.getElementById('go').onclick=()=>{S.started=true;save();tab='draft';render()};
}
render();
</script>
</body>
</html>
